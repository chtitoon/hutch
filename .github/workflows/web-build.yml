# Checks every pull request and push to main against the website's tests: generated files are
# current (tokens, favicon, link preview), the site builds, its HTML is valid, its internal links
# resolve and every page fits the file-size budgets in apps/web/PERFORMANCE.md.
# A required check on main, so it runs on every PR with no path filter: a required check that
# never starts would block unrelated PRs. On Linux it takes under a minute.
name: Web Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  website:
    name: Website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run validate:website
