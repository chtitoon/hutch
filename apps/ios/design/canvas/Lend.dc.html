<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hutch — Lend to a neighbor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C4A;text-decoration:none}a:hover{color:#163F33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #5E6762; color: #18201C; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 20px; padding: 10px 20px 36px; border-radius: 28px 28px 0 0; background: #EEF0EC; min-height: 720px; box-sizing: border-box">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #C9D1CB"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 14px; font-weight: 600; color: #4A5750">Lend</div>
        <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 400; font-size: 32px; line-height: 1.05">Cast-iron Dutch oven</h1>
      </div>
      <a href="Item.dc.html" aria-label="Close" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #DDE3DE; color: #18201C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5750">To</h2>
      <div role="radiogroup" aria-label="Neighbor" style="display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; overflow: hidden">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{p.checked}}" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 0; border-bottom: 1px solid #E6EAE7; background: transparent; font: inherit; color: #18201C; text-align: left">
            <span style="width: 36px; height: 36px; border-radius: 999px; background: #DDE3DE; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #2C3A33">{{p.initial}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: #4A5750">{{p.meta}}</span></span>
            <span style="{{p.dot}}"></span>
          </button>
        </sc-for>
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; font-size: 16px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Invite a neighbor</a>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5750">When it should come back</h2>
      <div role="radiogroup" aria-label="When it should come back" style="display: flex; gap: 8px">
        <sc-for list="{{dates}}" as="d" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{d.checked}}" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #2C3A33">
        <svg style="flex: none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
        <span>{{dueLine}}</span>
      </div>
    </div>
    <div style="display: flex; gap: 10px; padding: 14px 16px; border-radius: 16px; background: #DDE3DE; font-size: 14px; line-height: 1.45; color: #2C3A33">
      <svg style="flex: none; margin-top: 2px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <span>{{who}} sees this one item and the return date. Nothing else in your hutch.</span>
    </div>
    <a href="Main.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #1F5C4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Send lend request</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { person: 'marie', date: 'week' };
  }
  renderVals() {
    var self = this;
    var people = [
      { id: 'marie', name: 'Marie D.', meta: 'Next door · borrowed 3 times', initial: 'M' },
      { id: 'sam', name: 'Sam K.', meta: 'Across the street', initial: 'S' },
      { id: 'priya', name: 'Priya R.', meta: 'Two doors down', initial: 'P' }
    ];
    var dates = [
      { id: 'weekend', label: 'This weekend' },
      { id: 'week', label: 'In a week' },
      { id: 'pick', label: 'Pick a date' }
    ];
    var chosen = people.filter(function (p) { return p.id === self.state.person; })[0];
    var first = chosen ? chosen.name.split(' ')[0] : 'They';
    var due = { weekend: 'Due back Sun, Oct 18', week: 'Due back Tue, Oct 20', pick: 'Choose a date on the calendar' }[this.state.date];
    return {
      who: first,
      dueLine: this.state.date === 'pick' ? due : due + ' · we’ll remind ' + first + ' the day before',
      people: people.map(function (p) {
        var on = self.state.person === p.id;
        return {
          name: p.name, meta: p.meta, initial: p.initial,
          checked: on ? 'true' : 'false',
          dot: on ? 'width: 22px; height: 22px; border-radius: 999px; box-sizing: border-box; border: 7px solid #1F5C4A; background: #FFFFFF' : 'width: 22px; height: 22px; border-radius: 999px; box-sizing: border-box; border: 2px solid #A9B3AC',
          pick: function () { self.setState({ person: p.id }); }
        };
      }),
      dates: dates.map(function (d) {
        var on = self.state.date === d.id;
        return {
          label: d.label,
          checked: on ? 'true' : 'false',
          style: 'flex: 1; height: 44px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; ' + (on ? 'border: 0; background: #18201C; color: #FFFFFF' : 'border: 1px solid #C9D1CB; background: transparent; color: #18201C'),
          pick: function () { self.setState({ date: d.id }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
