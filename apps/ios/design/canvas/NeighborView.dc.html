<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hutch — What a neighbor sees</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C4A;text-decoration:none}a:hover{color:#163F33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #18201C; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 32px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="ShareConfirm.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; font-size: 16px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Neighbors</a>
    <span style="padding: 6px 12px; border-radius: 999px; background: #DDE3DE; font-size: 13px; font-weight: 600; color: #2C3A33">Marie's phone</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 14px; font-weight: 600; color: #4A5750">Shared with you by Antoine · next door</div>
    <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 400; font-size: 34px; line-height: 1.05">Cast-iron Dutch oven</h1>
  </div>
  <div style="height: 200px; border-radius: 20px; background: #D5DBD6; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4A5750">[Item photo]</div>
  <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #1F5C4A">
    <span style="width: 10px; height: 10px; border-radius: 999px; background: #1F5C4A"></span>Available now
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5750">How long do you need it?</h2>
    <div role="radiogroup" aria-label="How long" style="display: flex; gap: 8px">
      <sc-for list="{{spans}}" as="s" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>
  </div>
  <label style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5750">Note (optional)</span>
    <input type="text" placeholder="Making stew for the block party!" style="height: 48px; padding: 0 16px; border: 1px solid #D5DBD6; border-radius: 14px; background: #FFFFFF; font: inherit; font-size: 16px; color: #18201C">
  </label>
  <a href="Request.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #1F5C4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Ask Antoine to borrow</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { span: 'weekend' };
  }
  renderVals() {
    var self = this;
    return {
      spans: [
        { id: 'day', label: 'A day' },
        { id: 'weekend', label: 'Weekend' },
        { id: 'week', label: 'A week' }
      ].map(function (s) {
        var on = self.state.span === s.id;
        return {
          label: s.label,
          checked: on ? 'true' : 'false',
          style: 'flex: 1; height: 44px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; ' + (on ? 'border: 0; background: #18201C; color: #FFFFFF' : 'border: 1px solid #C9D1CB; background: transparent; color: #18201C'),
          pick: function () { self.setState({ span: s.id }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
