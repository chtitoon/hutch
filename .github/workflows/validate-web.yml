# The website, on every pull request and push to main. Both are checks on the PR; Validate Build is
# required on main, so this workflow has no path filter: a required check that never starts would
# block unrelated PRs.
name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-web-${{ github.ref }}
  cancel-in-progress: true

env:
  LIGHTHOUSE_VERSION: 12.6.1
  MARKER: '<!-- hutch-performance -->'

jobs:
  # The website's tests: generated files are current (tokens, favicon, link preview), the site
  # builds, its HTML is valid, its internal links resolve and every page fits the file-size budgets
  # in apps/web/PERFORMANCE.md. On Linux it takes under a minute.
  build:
    name: Validate Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run web:build

  # Lighthouse on main and the PR, compared with the limits in apps/web/PERFORMANCE.md (D19), for
  # pull requests touching the website. File-size budgets run in Validate Build and in `npm test`,
  # Cloudflare's deploy gate; this check needs a browser, so it lives here.
  page-speed:
    name: Validate Page Speed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Pull requests that don't touch the website skip the rest in seconds.
      - name: Check the PR touches the website
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -qE '^(apps/web/|DESIGN\.md$|design/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "The PR doesn't touch the website, so Lighthouse was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out the PR
        if: steps.scope.outputs.web == 'true'
        uses: actions/checkout@v5
        with:
          path: pr
      - name: Check out main
        if: steps.scope.outputs.web == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.web == 'true'
        with:
          node-version-file: pr/apps/web/.node-version
          cache: npm
          cache-dependency-path: |
            pr/apps/web/package-lock.json
            main/apps/web/package-lock.json

      - name: Build both
        if: steps.scope.outputs.web == 'true'
        run: |
          for side in main pr; do
            (cd "$side/apps/web" && npm ci && npm run build)
          done

      # Identical files give identical results, so only pages that differ from main are measured.
      - name: Find changed pages
        id: pages
        if: steps.scope.outputs.web == 'true'
        run: |
          pages=$(node pr/apps/web/compare-performance.mjs --changed main/apps/web/dist pr/apps/web/dist | tr '\n' ' ')
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          if [ -z "${pages// }" ]; then echo "No page differs from main, so Lighthouse was skipped." >> "$GITHUB_STEP_SUMMARY"; fi
          echo "Changed pages: ${pages:-none}"

      # Lighthouse isn't a dependency of the site, so Cloudflare's build doesn't install it.
      - name: Run Lighthouse
        if: steps.pages.outputs.pages != ''
        working-directory: pr/apps/web
        env:
          PAGES: ${{ steps.pages.outputs.pages }}
        run: |
          npm install --no-save --no-audit --no-fund "lighthouse@$LIGHTHOUSE_VERSION"
          # shellcheck disable=SC2086 # one argument per page
          node run-lighthouse.mjs ../../../main/apps/web/dist dist ../../../results $PAGES

      - name: Compare
        id: compare
        if: steps.pages.outputs.pages != ''
        run: |
          set +e
          node pr/apps/web/compare-performance.mjs results/main results/pr --comment comment.md > report.txt
          status=$?
          cat report.txt
          { echo '```text'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # One comment, only when the PR is faster; removed again if a later push loses the gain.
      - name: Celebrate or tidy up
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -f comment.md ]; then
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
            else
              gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
            fi
          elif [ -n "$existing" ]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$existing"
          fi
