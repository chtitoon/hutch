# XcodeGen spec. Run `make setup` after changing it; the .xcodeproj is generated and never committed (D9).
name: Hutch
options:
  bundleIdPrefix: app.myhutch
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  HutchCore:
    path: HutchCore
targets:
  Hutch:
    type: application
    platform: iOS
    sources: [Hutch]
    dependencies:
      - package: HutchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.myhutch.ios
        PRODUCT_NAME: Hutch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hutch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  Hutch:
    build:
      targets:
        Hutch: all
    test:
      targets:
        - package: HutchCore/HutchCoreTests
